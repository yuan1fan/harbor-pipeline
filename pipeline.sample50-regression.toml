# Eight-CVE recovery regression. Share the host queue with the original checkout.
# Candidate/LLM workers: 2; Docker slots: 2; trials per candidate: 1.
[pipeline]
output_dir = "runs"
# Reuse only the endpoint/auth pair from local Claude settings when this
# PowerShell has no connection overrides. No credentials are written here.
inherit_claude_settings = true
# Concurrent author/LLM candidates; Docker phases have a separate host queue.
workers = 2
# Concurrent trials inside one candidate. Docker admission below caps the
# aggregate build/probe/trial concurrency across candidate workers.
trial_workers = 1
docker_slots = 2
resource_dir = "../harbor_pipeline/work/resources"
min_free_memory_mb = 3584
min_free_disk_gb = 15
# A two-hour admission wait hid a dead WSL memory pool.  Fail fast so the
# batch reports the resource problem instead of holding every worker.
resource_wait_sec = 300
wsl_reclaim_memory = true
prune_images = true
build_cache_keep_gb = 20
max_repairs = 6
max_infra_retries = 2
stage_retry_attempts = 2
# Authoring is one native Claude Code session per candidate. ``legacy`` keeps
# the old draft + JSON repair path for a fallback during the transition.
authoring = "agent"
# Resolve only incomplete evidence with a small native session; it cannot
# build or author, and freeze/depcheck still validate its proposal.
evidence_resolver = true
author_max_resumes = 2
author_build_runs = 60
author_probe_runs = 80
author_exec_runs = 100
solver_review = true
solver_attempts = 1
solver_max_turns = 60
solver_max_budget_usd = 5.0
solver_agent_timeout_sec = 1800
solver_timeout_sec = 2700
solver_min_score = 3
trials = 20
min_trials = 20
# Per-candidate model ceilings. The batch ledger multiplies these by the
# candidate count; they are never a whole-run limit.
max_calls = 60
max_total_tokens = 2000000
max_context_bytes = 600000
# 300s was short enough that a normal 60s build timed out under twenty
# concurrent trials. A build that genuinely hangs still ends well before the
# job-level timeout in harbor_adapter.
command_timeout_sec = 1800
# Exact tag for development. Replace with an immutable digest before production acceptance.
python_image = "python:3.12.10-slim-bookworm"
require_harbor_lint = true

[models.default]
provider = "claude-cli"
model = "deepseek-flash[1m]"
# 600s was tried overnight: the repair call still returned nothing, and the
# longer ceiling only doubled how long a stuck repair blocks its candidate.
timeout_sec = 300
max_output_tokens = 18000
# Per CLI call; this is not a whole-run USD limit.
max_budget_usd = 30.0

# Native Claude Code authoring session. The model name is written into the
# generated settings file; the gateway credentials stay in the child process
# environment and are never persisted.
[models.author]
provider = "claude-code"
model = "deepseek-flash[1m]"
timeout_sec = 5400
max_turns = 200
autocompact = "400k"
max_budget_usd = 20.0


[models.resolver]
provider = "claude-code"
model = "deepseek-flash[1m]"
timeout_sec = 1200
max_turns = 40
autocompact = "200k"
max_budget_usd = 2.0

[models.solver]
provider = "claude-code"
model = "deepseek-flash[1m]"
max_turns = 60
max_budget_usd = 5.0
timeout_sec = 1800

[models.reviewer]
provider = "claude-cli"
model = "deepseek-flash[1m]"
max_output_tokens = 12000
timeout_sec = 600

# Legacy completion roles. They are only used when authoring = "legacy".
[models.repairer]
provider = "anthropic"
model = "deepseek-flash[1m]"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

# Synthesis needs a completion-only endpoint: the CLI's coding agent keeps
# requesting tools even when they are disabled, which corrupts JSON output.
[models.synthesizer]
provider = "anthropic"
model = "deepseek-flash[1m]"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

[sources]
allowed_hosts = ["raw.githubusercontent.com", "github.com", "codeload.github.com", "www.cve.org", "nvd.nist.gov", "cveawg.mitre.org", "pypi.org", "api.osv.dev", "api.github.com", "services.nvd.nist.gov", "registry.npmjs.org", "proxy.golang.org", "sum.golang.org", "repo1.maven.org", "api.wordpress.org", "downloads.wordpress.org"]
max_bytes = 1500000
timeout_sec = 30
# Serve per-CVE NVD records from the cached yearly feed instead of the API,
# which allows only 5 requests per 30 seconds without a key. The directory is
# shared with `harvest`, so the feed is downloaded once.
nvd_feed_cache = "../harbor_pipeline/work/harvest"
nvd_feed_max_age_sec = 604800
