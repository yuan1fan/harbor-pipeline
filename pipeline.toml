[pipeline]
output_dir = "runs"
workers = 1
max_repairs = 2
trials = 5
min_trials = 5
max_calls = 12
max_total_tokens = 180000
max_context_bytes = 600000
command_timeout_sec = 300
# Exact tag for development. Replace with an immutable digest before production acceptance.
python_image = "python:3.12.10-slim-bookworm"
require_harbor_lint = true

[models.default]
provider = "claude-cli"
model = "sonnet"
timeout_sec = 300
max_output_tokens = 18000
# Per CLI call; this is not a whole-run USD limit.
max_budget_usd = 3.0

# Every role uses a new request/session. Override any role independently.
#[models.reviewer]
#provider = "anthropic"
#model = "${CLAUDE_MODEL}"
#timeout_sec = 300
#max_output_tokens = 12000

[sources]
allowed_hosts = ["raw.githubusercontent.com", "github.com", "www.cve.org", "nvd.nist.gov", "cveawg.mitre.org", "pypi.org"]
max_bytes = 1500000
timeout_sec = 30
