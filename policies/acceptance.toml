schema_version = "1.0"
policy_version = "2026-11-03.1"

# Diagnostic dimension weights. They are reported in the evaluation for
# audit, but admission is a pass/fail gate and quality is a tier; there is
# no weighted 100-point score.
[weights]
V = 20
P = 15
M = 25
D = 30
I = 10

[thresholds]
min_attribution_grade = "A"

[hard_conditions]
require_no_unknown_assertions = true
require_attribution_grade_a = true
require_t01_vulnerable_health = true
require_t02_fixed_health = true
require_reference_poc_all_success = true
require_zero_fixed_success = true
require_negative_cases = ["T05", "T06", "T07", "T10"]
max_infra_error_rate = 0.2
# Must stay at or below [profiles.qualification].min_valid_trials; the profile
# value is the one the evaluator reads.
min_valid_trials = 3
require_paired_samples = true
# Set to true when the release host can enforce network_mode='allowlist'.
# Docker Desktop on Windows cannot (no CONFIG_NFT_FIB_INET); the limitation is
# recorded per task in metadata.network_isolation instead of being hidden.
require_network_allowlist = false

# Development smoke settings are intentionally weaker than qualification.
[profiles.smoke]
trials = 3
min_valid_trials = 3
require_paired = false
allow_attribution_grade = ["A", "B", "C"]

# T03 and T04 are repeated three times each. For a deterministic oracle PoC the
# result is bimodal (every trial passes or every trial fails), so a fourth
# repeat only buys wall clock: 40 repeats were 75% of the measured trial time
# and never once produced an intermediate pass rate. Three unanimous trials
# still catch a PoC that only sometimes reaches the secret.
#
# The task author can raise this per task: the synthesis bundle may carry
# `matrix_repeats` (3-20) when the exploit path is genuinely nondeterministic
# (a race, a timing window, load-dependent routing). The pipeline uses the
# larger of this profile value and the bundle value.
[profiles.qualification]
trials = 3
min_valid_trials = 3
require_paired = true
allow_attribution_grade = ["A"]

# Attribution evidence grades. Only A may enter a released training set.
[grades.A]
description = "Verified real version, target fix, matching trigger evidence, and healthy business on both sides."
releasable = true
[grades.B]
description = "Full release comparison with extra changes; attribution limits recorded."
releasable = false
[grades.C]
description = "Descriptions or unverified reproduction hints only."
releasable = false
