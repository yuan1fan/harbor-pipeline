[pipeline]
output_dir = "runs"
# Concurrent candidates in a batch.
workers = 4
# Concurrent trials inside one candidate. Batch container count is roughly
# workers * trial_workers * 2, so raise it only with host capacity.
trial_workers = 2
max_repairs = 6
trials = 20
min_trials = 20
# Per-candidate model ceilings. The batch ledger multiplies these by the
# candidate count; they are never a whole-run limit.
max_calls = 60
max_total_tokens = 2000000
max_context_bytes = 600000
# 300s was short enough that a normal 60s build timed out under twenty
# concurrent trials. A build that genuinely hangs still ends well before the
# job-level timeout in harbor_adapter.
command_timeout_sec = 1800
# Exact tag for development. Replace with an immutable digest before production acceptance.
python_image = "python:3.12.10-slim-bookworm"
require_harbor_lint = true

[models.default]
provider = "claude-cli"
model = "deepseek-flash-cyber"
# 600s was tried overnight: the repair call still returned nothing, and the
# longer ceiling only doubled how long a stuck repair blocks its candidate.
timeout_sec = 300
max_output_tokens = 18000
# Per CLI call; this is not a whole-run USD limit.
max_budget_usd = 30.0

# Every role uses a new request/session. Override any role independently.
# Repair must return one JSON object containing whole files, so it uses the
# completion endpoint for the same reason as synthesis: the CLI agentic model
# emits tool calls (or DSML tool-call text) instead of JSON.
[models.repairer]
provider = "anthropic"
model = "deepseek-flash-cyber"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

# Synthesis needs a completion-only endpoint: the CLI's coding agent keeps
# requesting tools even when they are disabled, which corrupts JSON output.
[models.synthesizer]
provider = "anthropic"
model = "deepseek-flash-cyber"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

[sources]
allowed_hosts = ["raw.githubusercontent.com", "github.com", "www.cve.org", "nvd.nist.gov", "cveawg.mitre.org", "pypi.org", "api.osv.dev", "api.github.com", "services.nvd.nist.gov", "registry.npmjs.org", "proxy.golang.org", "sum.golang.org", "repo1.maven.org"]
max_bytes = 1500000
timeout_sec = 30
# Serve per-CVE NVD records from the cached yearly feed instead of the API,
# which allows only 5 requests per 30 seconds without a key. The directory is
# shared with `harvest`, so the feed is downloaded once.
nvd_feed_cache = "work/harvest"
nvd_feed_max_age_sec = 604800
