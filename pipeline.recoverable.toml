# Recovery run: 30 previously unsupported/quarantined candidates, with the
# authenticated GitHub helper and a slightly lower memory reserve/more infra
# retries so a transient Docker or host-memory failure does not quarantine a
# candidate again. Solver stays at the normal 60-turn budget.
[pipeline]
output_dir = "runs"
inherit_claude_settings = true
workers = 2
trial_workers = 1
docker_slots = 2
resource_dir = "work/resources"
min_free_memory_mb = 3072
min_free_disk_gb = 15
resource_wait_sec = 600
wsl_reclaim_memory = true
prune_images = true
build_cache_keep_gb = 20
max_repairs = 6
max_infra_retries = 3
stage_retry_attempts = 3
authoring = "agent"
evidence_resolver = true
author_max_resumes = 2
author_build_runs = 60
author_probe_runs = 80
author_exec_runs = 100
solver_review = true
solver_attempts = 1
solver_max_turns = 60
solver_max_budget_usd = 5.0
solver_agent_timeout_sec = 1800
solver_timeout_sec = 2700
solver_min_score = 3
trials = 20
min_trials = 20
max_calls = 60
max_total_tokens = 2000000
max_context_bytes = 600000
# Generic Harbor/matrix command timeout stays bounded.
command_timeout_sec = 1800
# Author target builds in the recovery set can exceed 30 min.
author_build_timeout_sec = 3600
python_image = "python:3.12.10-slim-bookworm"
require_harbor_lint = true

[models.default]
provider = "claude-cli"
model = "deepseek-flash[1m]"
timeout_sec = 300
max_output_tokens = 18000
max_budget_usd = 30.0

[models.author]
provider = "claude-code"
model = "deepseek-flash[1m]"
timeout_sec = 5400
max_turns = 200
autocompact = "400k"
max_budget_usd = 20.0

[models.resolver]
provider = "claude-code"
model = "deepseek-flash[1m]"
timeout_sec = 1200
max_turns = 40
autocompact = "200k"
max_budget_usd = 2.0

[models.solver]
provider = "claude-code"
model = "deepseek-flash[1m]"
max_turns = 60
max_budget_usd = 5.0
timeout_sec = 1800

[models.reviewer]
provider = "claude-cli"
model = "deepseek-flash[1m]"
max_output_tokens = 12000
timeout_sec = 600

[models.repairer]
provider = "anthropic"
model = "deepseek-flash[1m]"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

[models.synthesizer]
provider = "anthropic"
model = "deepseek-flash[1m]"
max_output_tokens = 32000
api_base = "${ANTHROPIC_BASE_URL}"
api_version = "2023-06-01"

[sources]
allowed_hosts = ["raw.githubusercontent.com", "github.com", "codeload.github.com", "www.cve.org", "nvd.nist.gov", "cveawg.mitre.org", "pypi.org", "api.osv.dev", "api.github.com", "services.nvd.nist.gov", "registry.npmjs.org", "proxy.golang.org", "sum.golang.org", "repo1.maven.org", "api.wordpress.org", "downloads.wordpress.org"]
max_bytes = 1500000
timeout_sec = 30
nvd_feed_cache = "work/harvest"
nvd_feed_max_age_sec = 604800
