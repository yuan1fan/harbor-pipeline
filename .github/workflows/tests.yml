name: tests
on: [push, pull_request]
jobs:
  unit-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" wheel
      - run: python -m pytest
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, 'tests/check_wheel.py', glob.glob('dist/*.whl')[0]], check=True)"
  container-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: docker pull python:3.12-slim-bookworm
      - run: python -m pytest tests/test_container_hardening.py
        env:
          HARBOR_RUN_DOCKER_TESTS: '1'
